name: Angular CI CD Pipeline

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angular-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.22.1'
  BUILD_OUTPUT: 'dist/enterprise-lms/browser'

jobs:

  # ========================================
  # CONTINUOUS INTEGRATION
  # ========================================

  build:
    name: CI - Build Angular
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build -- --configuration production

      - name: Verify Build Output
        run: |
          test -f "$BUILD_OUTPUT/index.html"
          test -f "$BUILD_OUTPUT/staticwebapp.config.json"

      - name: Upload Angular Artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-${{ github.sha }}
          path: ${{ env.BUILD_OUTPUT }}/
          if-no-files-found: error
          retention-days: 7

  # ========================================
  # CONTINUOUS DEPLOYMENT
  # ========================================

  deploy:
    name: CD - Deploy to Azure
    needs: build

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: development
      url: ${{ steps.deploy.outputs.static_web_app_url }}

    steps:
      - name: Download Angular Artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-build-${{ github.sha }}
          path: deployment

      - name: Verify Deployment Files
        run: |
          ls -la deployment
          test -f deployment/index.html
          test -f deployment/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: deployment
          api_location: ''
          output_location: ''
          skip_app_build: true
          production_branch: 'main'
